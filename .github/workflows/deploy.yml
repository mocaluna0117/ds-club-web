name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'  # frontend/ 以下のファイルが変更されたときだけ自動デプロイ

  # 管理画面でコンテンツ(メンバー・記事)を更新したときにバックエンドが発火する。
  # 公開データのスナップショットを焼き直すために再ビルドする。
  repository_dispatch:
    types: [content-updated]

  # スナップショットが古くなりすぎないよう毎日1回再ビルド (21:00 UTC = 6:00 JST)
  schedule:
    - cron: '0 21 * * *'

  # GitHub の Actions タブから手動でデプロイを実行できる。
  # 例: 環境変数 (VITE_API_URL) を変更した後に反映させたいとき。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      snapshot_outcome: ${{ steps.snapshot.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 公開データ(メンバー・記事・活動記録)をAPIから取得してバンドルに焼き込む。
      # 訪問者はAPIのコールドスタートを待たずに即時表示される。
      # APIが寝ていても起きるまでリトライする。失敗してもコミット済みのスナップショットで
      # デプロイは継続させ、代わりに最後の report ジョブで run を赤くして通知を飛ばす。
      - name: Generate content snapshot
        id: snapshot
        continue-on-error: true
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: node scripts/generate-snapshot.mjs

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # スナップショット生成の失敗を可視化する。デプロイ自体は成功させたまま run を赤くし、
  # GitHub の失敗通知メールで気づけるようにする (API が suspend された等の唯一の検知手段)。
  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.snapshot_outcome != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot generation failed
        run: |
          echo "::error::公開データのスナップショット生成に失敗しました。"
          echo "前回のスナップショットでデプロイは完了しています。"
          echo "API (Render) が停止していないか、無料インスタンス時間を使い切っていないか確認してください。"
          exit 1
