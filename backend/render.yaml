services:
  - type: web
    name: ds-club-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_REBUILD_TOKEN # コンテンツ更新時にフロント再ビルドを起動するPAT (任意)
        sync: false
      - key: NODE_ENV # イントロスペクション/Sandbox の無効化とエラー内容の秘匿に使う
        value: production
      - key: PORT
        value: 3001
